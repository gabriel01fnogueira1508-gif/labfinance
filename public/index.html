  return s;
};

// converte datas do Excel, dd/mm/yyyy e yyyy-mm-dd para yyyy-mm-dd
function normalizeDateInput(value) {
  if (!value && value !== 0) return '';
  if (typeof value === 'number') {
    const d = XLSX.SSF.parse_date_code(value);
    if (!d) return '';
    const mm = String(d.m).padStart(2, '0');
    const dd = String(d.d).padStart(2, '0');
    return `${d.y}-${mm}-${dd}`;
  }
  const s = String(value).trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
    const [dd, mm, yyyy] = s.split('/');
    return `${yyyy}-${mm}-${dd}`;
  }
  return s;
}

function currencyToNumber(value) {
  if (typeof value === 'number') return value;
  const s = String(value ?? '').trim();
  if (!s) return 0;
  const cleaned = s
    .replace(/\s/g, '')
    .replace(/R\$/gi, '')
    .replace(/\./g, '')
    .replace(',', '.');
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : 0;
}

// ─── STORAGE HOOK ────────────────────────────────────────────────────────────

const API_BASE = window.API_BASE || `${window.location.origin}/api`;
const FORCE_REMOTE = !/github\.io$/i.test(window.location.hostname) && !/file:/i.test(window.location.protocol);

function useLS(key, initial) {
  const [val, setVal] = useState(initial);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let ignore = false;

    const load = async () => {
      try {
        if (FORCE_REMOTE) {
          const res = await fetch(`${API_BASE}/store/${encodeURIComponent(key)}`);
          if (!res.ok) throw new Error('Falha ao carregar dados do servidor');
          const data = await res.json();
          const next = data?.value ?? initial;
          if (!ignore) {
            setVal(next);
            setLoaded(true);
          }
          return;
        }
      } catch (err) {
        console.warn('Usando armazenamento local por falha no servidor:', err);
      }

      try {
        const s = localStorage.getItem(key);
        if (!ignore) setVal(s ? JSON.parse(s) : initial);
      } catch {
        if (!ignore) setVal(initial);
      } finally {
        if (!ignore) setLoaded(true);
      }
    };

    load();
    return () => { ignore = true; };
  }, [key]);

  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;

      if (FORCE_REMOTE) {
        fetch(`${API_BASE}/store/${encodeURIComponent(key)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: next })
        }).catch(err => console.error('Erro ao salvar no servidor:', err));
      } else {
        localStorage.setItem(key, JSON.stringify(next));
      }

      return next;
    });
  }, [key]);

  return [val, set, loaded];
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type='success') => {
    const id = genId();
    setToasts(p => [...p, {id,msg,type}]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3200);
  }, []);
  return [toasts, push];
}

// ─── MODAL ───────────────────────────────────────────────────────────────────

function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    const h = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/40 no-print p-4" onClick={onClose}>
      <div
        className={`bg-white rounded-2xl shadow-2xl w-full animate-fade flex flex-col max-h-[90vh] ${wide?'max-w-4xl':'max-w-xl'}`}
        onClick={e=>e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="font-semibold text-slate-800 text-base">{title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl leading-none">×</button>
        </div>
        <div className="overflow-y-auto flex-1 p-6">{children}</div>
      </div>
    </div>
  );
}

// ─── CHART BOX ───────────────────────────────────────────────────────────────

function ChartBox({ type, data, options={}, height=220 }) {
  const ref  = useRef(null);
  const inst = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (inst.current) {
      inst.current.destroy();
      inst.current = null;
    }
    inst.current = new Chart(ref.current, {
      type,
      data,
      options: {
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}
        },
        ...options
      }
    });
    return () => {
      if (inst.current) {
        inst.current.destroy();
        inst.current = null;
      }
    };
  }, [JSON.stringify(data), type]);

  return <div style={{height}}><canvas ref={ref} /></div>;
}

function ProjectForm({ project, onSave, onCancel }) {
  const blank = {
    nome:'',
    coordenador:'',
    instituicao:'',
    tipo:'Pesquisa',
    tipo_outro:'',
    data_criacao:todayISO(),
    observacoes:''
  };

  const init = project
    ? {
        ...blank,
        ...project,
        tipo_outro: PROJECT_TYPES.includes(project.tipo) ? '' : project.tipo,
        tipo: PROJECT_TYPES.includes(project.tipo) ? project.tipo : 'Outro'
      }
    : blank;

  const [form, setForm] = useState(init);
  const [err,  setErr]  = useState({});

  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value }));

  const validate = () => {
    const e = {};
    if (!form.nome.trim()) e.nome = 'Nome é obrigatório';
    if (!form.coordenador.trim()) e.coordenador = 'Coordenador é obrigatório';
    if (form.tipo==='Outro' && !form.tipo_outro.trim()) e.tipo_outro = 'Informe o tipo';
    setErr(e);
    return !Object.keys(e).length;
  };

  const submit = () => {
    if (!validate()) return;
    onSave({
      ...form,
      tipo: form.tipo==='Outro' ? form.tipo_outro.trim() : form.tipo
    });
  };

  return (
    <div className="space-y-4">
      <Field label="Nome do Projeto" required>
        <input className={inputCls} value={form.nome} onChange={set('nome')} placeholder="Ex.: Pesquisa em Biossensores" />
        {err.nome && <p className="text-red-500 text-xs mt-0.5">{err.nome}</p>}
      </Field>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Coordenador Responsável" required>
          <input className={inputCls} value={form.coordenador} onChange={set('coordenador')} placeholder="Prof. Dr. ..." />
          {err.coordenador && <p className="text-red-500 text-xs mt-0.5">{err.coordenador}</p>}
        </Field>
        <Field label="Instituição / Laboratório">
          <input className={inputCls} value={form.instituicao} onChange={set('instituicao')} placeholder="UFMG – Lab. XYZ" />
        </Field>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <Field label="Tipo de Projeto">
            <select className={selectCls} value={form.tipo} onChange={set('tipo')}>
              {PROJECT_TYPES.map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          {form.tipo==='Outro' && (
            <div className="mt-2 animate-fade">
              <input className={inputCls} value={form.tipo_outro} onChange={set('tipo_outro')} placeholder="Digite o tipo..." autoFocus />
              {err.tipo_outro && <p className="text-red-500 text-xs mt-0.5">{err.tipo_outro}</p>}
            </div>
          )}
        </div>

        <Field label="Data de Criação">
          <input type="date" className={inputCls} value={form.data_criacao} onChange={set('data_criacao')} />
        </Field>
      </div>

      <Field label="Observações Gerais">
        <textarea className={inputCls} rows={3} value={form.observacoes} onChange={set('observacoes')} placeholder="Informações adicionais..." />
      </Field>

      <div className="flex gap-2 pt-2 justify-end">
        <button onClick={onCancel} className="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Cancelar</button>
        <button onClick={submit} className="px-5 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium">
          {project ? 'Salvar alterações' : 'Criar projeto'}
        </button>
      </div>
    </div>
  );
}

// ─── ITEM FORM ───────────────────────────────────────────────────────────────

function ItemForm({ item, projectTypes, projectRubricas, onSave, onCancel }) {
  const tipoNomes = projectTypes && projectTypes.length > 0
    ? projectTypes.map(t => t.nome)
    : DEFAULT_ITEM_TYPES;

  const rubricaNomes = projectRubricas && projectRubricas.length > 0
    ? projectRubricas.map(r => r.nome)
    : DEFAULT_RUBRICAS;

  const isCustom = item && !tipoNomes.includes(item.tipo_item);

  const blank = {
    tipo_item: tipoNomes[0] || '',
    tipo_item_outro:'',
    descricao:'',
    quantidade:1,
    valor_unitario_aprovado:'',
    rubrica: rubricaNomes[0] || 'Custeio',
    valor_unitario_pago:'',
    numero_pedido_of:'',
    data_solicitacao:todayISO(),
    fornecedor:'',
    previsao_entrega:'',
    nf:'',
    pago:false,
    observacoes:''
  };

  const init = item
    ? {
        ...blank,
        ...item,
        tipo_item: isCustom ? '__outro__' : item.tipo_item,
        tipo_item_outro: isCustom ? item.tipo_item : ''
      }
    : blank;

  const [f, setF] = useState(init);
  const [err, setErr] = useState({});
  const [salvarTipo, setSalvarTipo] = useState(true);

  const set = k => e => {
    const v = e.target.type==='checkbox' ? e.target.checked : e.target.value;
    setF(p => {
      const n = { ...p, [k]: v };
      n.valor_total_aprovado = (Number(n.quantidade)||0) * (Number(n.valor_unitario_aprovado)||0);
      n.valor_total_pago     = (Number(n.quantidade)||0) * (Number(n.valor_unitario_pago)||0);
      n.saldo = n.valor_total_aprovado - n.valor_total_pago;
      return n;
    });
  };

  const validate = () => {
    const e = {};
    if (!f.descricao.trim()) e.descricao = 'Descrição obrigatória';
    if (!f.fornecedor.trim()) e.fornecedor = 'Fornecedor obrigatório';
    if (Number(f.quantidade)<=0) e.quantidade = 'Qtd > 0';
    if (f.tipo_item==='__outro__' && !f.tipo_item_outro.trim()) e.tipo_item_outro = 'Informe o tipo';
    setErr(e);
    return !Object.keys(e).length;
  };

  const submit = () => {
    if (!validate()) return;
    const tipoFinal = f.tipo_item==='__outro__' ? f.tipo_item_outro.trim() : f.tipo_item;
    const novoTipo = f.tipo_item==='__outro__' && salvarTipo ? tipoFinal : null;
    const { tipo_item_outro, ...rest } = f;
    onSave({ ...rest, tipo_item: tipoFinal }, novoTipo);
  };

  const vta   = (Number(f.quantidade)||0) * (Number(f.valor_unitario_aprovado)||0);
  const vtp   = (Number(f.quantidade)||0) * (Number(f.valor_unitario_pago)||0);
  const saldo = vta - vtp;
  const tipoAtual = f.tipo_item==='__outro__' ? (f.tipo_item_outro||'') : f.tipo_item;

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <Field label="Tipo do Item">
            <select className={selectCls} value={f.tipo_item} onChange={set('tipo_item')}>
              {tipoNomes.map(n => <option key={n} value={n}>{n}</option>)}
              <option value="__outro__">Outro (digitar)</option>
            </select>
          </Field>

          {tipoAtual && f.tipo_item !== '__outro__' && (
            <div className="mt-2">
              <TypeBadge nome={tipoAtual} projectTypes={projectTypes} />
            </div>
          )}

          {f.tipo_item==='__outro__' && (
            <div className="mt-2 space-y-1.5 animate-fade">
              <input className={inputCls} value={f.tipo_item_outro} onChange={set('tipo_item_outro')} placeholder="Digite o tipo..." autoFocus />
              {err.tipo_item_outro && <p className="text-red-500 text-xs">{err.tipo_item_outro}</p>}

              {f.tipo_item_outro.trim() && !tipoNomes.includes(f.tipo_item_outro.trim()) && (
                <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2">
                  <label className="flex items-center gap-2 cursor-pointer select-none">
                    <input
                      type="checkbox"
                      className="w-3.5 h-3.5 accent-blue-600"
                      checked={salvarTipo}
                      onChange={e=>setSalvarTipo(e.target.checked)}
                    />
                    <span className="text-xs text-slate-600">
                      Salvar <strong>"{f.tipo_item_outro.trim()}"</strong> na lista de tipos
                    </span>
                  </label>
                  <p className="text-[11px] text-blue-600 mt-1">
                    Se marcado, esse novo tipo ficará salvo na aba <strong>Tipos</strong> deste projeto.
                  </p>
                </div>
              )}
            </div>
          )}
        </div>

        <Field label="Rubrica">
          <select className={selectCls} value={f.rubrica} onChange={set('rubrica')}>
            {rubricaNomes.map(r => <option key={r}>{r}</option>)}
          </select>
        </Field>

        <Field label="Nº Pedido / OF">
          <input className={inputCls} value={f.numero_pedido_of} onChange={set('numero_pedido_of')} placeholder="PED-2024-001" />
        </Field>
      </div>

      <Field label="Descrição do Item" required>
        <input className={inputCls} value={f.descricao} onChange={set('descricao')} placeholder="Descreva o item ou serviço" />
        {err.descricao && <p className="text-red-500 text-xs">{err.descricao}</p>}
      </Field>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <Field label="Quantidade" required>
          <input type="number" min="1" className={inputCls} value={f.quantidade} onChange={set('quantidade')} />
          {err.quantidade && <p className="text-red-500 text-xs">{err.quantidade}</p>}
        </Field>

        <Field label="V. Unit. Aprovado (R$)">
          <input type="number" min="0" step="0.01" className={inputCls} value={f.valor_unitario_aprovado} onChange={set('valor_unitario_aprovado')} placeholder="0,00" />
        </Field>

        <Field label="V. Total Aprovado">
          <div className="rounded-lg border border-slate-100 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600">{fmtCurrency(vta)}</div>
        </Field>

        <Field label="V. Unit. Pago (R$)">
          <input type="number" min="0" step="0.01" className={inputCls} value={f.valor_unitario_pago} onChange={set('valor_unitario_pago')} placeholder="0,00" />
        </Field>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <Field label="V. Total Pago">
          <div className="rounded-lg border border-slate-100 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600">{fmtCurrency(vtp)}</div>
        </Field>

        <Field label="Saldo">
          <div className={`rounded-lg border px-3 py-2 text-sm font-semibold ${saldo<0?'border-red-200 bg-red-50 text-red-700':'border-emerald-100 bg-emerald-50 text-emerald-700'}`}>
            {fmtCurrency(saldo)}
          </div>
        </Field>

        <Field label="Pago?">
          <label className="flex items-center gap-2 h-9 cursor-pointer">
            <input type="checkbox" className="w-4 h-4 accent-blue-600" checked={f.pago} onChange={set('pago')} />
            <span className="text-sm text-slate-600">{f.pago ? 'Sim – pago' : 'Não – pendente'}</span>
          </label>
        </Field>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Fornecedor" required>
          <input className={inputCls} value={f.fornecedor} onChange={set('fornecedor')} placeholder="Nome do fornecedor" />
          {err.fornecedor && <p className="text-red-500 text-xs">{err.fornecedor}</p>}
        </Field>

        <Field label="Nota Fiscal (NF)">
          <input className={inputCls} value={f.nf} onChange={set('nf')} placeholder="NF-000000" />
        </Field>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Data da Solicitação">
          <input type="date" className={inputCls} value={f.data_solicitacao} onChange={set('data_solicitacao')} />
        </Field>

        <Field label="Previsão de Entrega">
          <input type="date" className={inputCls} value={f.previsao_entrega} onChange={set('previsao_entrega')} />
        </Field>
      </div>

      <Field label="Observações">
        <textarea className={inputCls} rows={2} value={f.observacoes} onChange={set('observacoes')} placeholder="Observações sobre este item..." />
      </Field>

      <div className="flex gap-2 pt-1 justify-end">
        <button onClick={onCancel} className="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Cancelar</button>
        <button onClick={submit} className="px-5 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium">
          {item ? 'Salvar alterações' : 'Adicionar item'}
        </button>
      </div>
    </div>
  );
}

// ─── TYPES TAB ───────────────────────────────────────────────────────────────

function TypesTab({ projectTypes, items, onUpdateTypes, toast }) {
  const nextAutoColor = autoColor(projectTypes.length);

  const [newName, setNewName] = useState('');
  const [newCor, setNewCor] = useState(nextAutoColor);
  const [newOrcamento, setNewOrcamento] = useState('');

  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState('');
  const [editCor, setEditCor] = useState('blue');
  const [editOrcamento, setEditOrcamento] = useState('');

  const [delNome, setDelNome] = useState(null);
  const inputRef = useRef(null);

  const add = () => {
    const v = newName.trim();
    if (!v) return;
    if (projectTypes.some(t => t.nome===v)) {
      toast('Este tipo já existe.','error');
      return;
    }
    const novoTipo = {
      id: genId(),
      nome: v,
      cor: newCor,
      orcamento: Number(newOrcamento) || 0
    };
    const updated = [...projectTypes, novoTipo];
    onUpdateTypes(updated);
    setNewName('');
    setNewOrcamento('');
    setNewCor(autoColor(updated.length));
    toast('Tipo adicionado!');
    inputRef.current?.focus();
  };

  const startEdit = t => {
    setEditId(t.id);
    setEditName(t.nome);
    setEditCor(t.cor);
    setEditOrcamento(String(Number(t.orcamento) || 0));
  };

  const saveEdit = () => {
    const v = editName.trim();
    if (!v) return;
    if (projectTypes.some(t => t.nome===v && t.id!==editId)) {
      toast('Já existe um tipo com este nome.','error');
      return;
    }
    onUpdateTypes(
      projectTypes.map(t =>
        t.id===editId
          ? { ...t, nome:v, cor:editCor, orcamento: Number(editOrcamento) || 0 }
          : t
      )
    );
    setEditId(null);
    toast('Tipo atualizado!');
  };

  const remove = nome => {
    onUpdateTypes(projectTypes.filter(t => t.nome!==nome));
    setDelNome(null);
    toast('Tipo removido.','error');
  };

  return (
    <div className="max-w-4xl space-y-5">
      <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700">
        <strong>🏷️ Tipos de Item deste projeto</strong>
        <p className="mt-1 text-xs text-blue-600">
          Cadastre tipos com cor e orçamento próprio. O sistema vai somar automaticamente os itens desse grupo
          e mostrar orçamento, total previsto e saldo.
        </p>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
        <h3 className="text-sm font-semibold text-slate-700">Adicionar novo tipo</h3>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input
            ref={inputRef}
            className={inputCls + " sm:col-span-2"}
            value={newName}
            onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&add()}
            placeholder="Ex.: Vidrarias, Reagentes, Equipamentos..."
          />
          <input
            type="number"
            min="0"
            step="0.01"
            className={inputCls}
            value={newOrcamento}
            onChange={e=>setNewOrcamento(e.target.value)}
            placeholder="Orçamento (R$)"
          />
        </div>

        <div>
          <p className="text-xs text-slate-500 mb-1.5">Cor do badge:</p>
          <ColorPicker value={newCor} onChange={setNewCor} />
        </div>

        {newName.trim() && (
          <div className="flex items-center gap-2 text-xs text-slate-500">
            <span>Pré-visualização:</span>
            <TypeBadge nome={newName.trim()} projectTypes={[{id:'prev', nome:newName.trim(), cor:newCor, orcamento:Number(newOrcamento)||0}]} />
          </div>
        )}

        <div className="flex justify-end">
          <button
            onClick={add}
            className="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 font-medium whitespace-nowrap"
          >
            + Adicionar
          </button>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
        <div className="px-5 py-3 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
          <span className="text-sm font-semibold text-slate-700">Tipos cadastrados</span>
          <span className="text-xs text-slate-400 bg-white border border-slate-200 px-2 py-0.5 rounded-full">
            {projectTypes.length} {projectTypes.length===1?'tipo':'tipos'}
          </span>
        </div>

        {projectTypes.length === 0 ? (
          <div className="text-center py-10 text-slate-400">
            <div className="text-3xl mb-2">🏷️</div>
            <div className="text-sm font-medium">Nenhum tipo cadastrado ainda</div>
            <div className="text-xs mt-1">Use o formulário acima para adicionar</div>
          </div>
        ) : (
          <ul className="divide-y divide-slate-50">
            {projectTypes.map((tipo, idx) => (
              <li key={tipo.id} className="px-5 py-3 hover:bg-slate-50 transition-colors group">
                {editId===tipo.id ? (
                  <div className="space-y-2 animate-fade">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <input
                        className={inputCls + " sm:col-span-2 py-1.5"}
                        value={editName}
                        onChange={e=>setEditName(e.target.value)}
                        onKeyDown={e=>{ if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditId(null); }}
                        autoFocus
                      />
                      <input
                        type="number"
                        min="0"
                        step="0.01"
                        className={inputCls + " py-1.5"}
                        value={editOrcamento}
                        onChange={e=>setEditOrcamento(e.target.value)}
                        placeholder="Orçamento (R$)"
                      />
                    </div>

                    <div>
                      <p className="text-xs text-slate-500 mb-1.5">Cor:</p>
                      <ColorPicker value={editCor} onChange={setEditCor} />
                    </div>

                    {editName.trim() && (
                      <div className="flex items-center gap-2 text-xs text-slate-500">
                        <span>Pré-visualização:</span>
                        <TypeBadge nome={editName.trim()} projectTypes={[{id:'prev', nome:editName.trim(), cor:editCor, orcamento:Number(editOrcamento)||0}]} />
                      </div>
                    )}

                    <div className="flex gap-2">
                      <button onClick={saveEdit} className="px-3 py-1.5 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Salvar</button>
                      <button onClick={()=>setEditId(null)} className="px-3 py-1.5 text-xs border border-slate-200 rounded-lg hover:bg-slate-100 text-slate-600">✕</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-start gap-3">
                    <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-xs flex items-center justify-center font-semibold flex-shrink-0 mt-1">
                      {idx+1}
                    </span>

                    <div className="flex-1">
                      <TypeBadge nome={tipo.nome} projectTypes={projectTypes} size="sm" />

                      {(() => {
                        const itensDoTipo = items.filter(i => i.tipo_item === tipo.nome);
                        const totalTipo = itensDoTipo.reduce((s, i) => s + i.valor_total_aprovado, 0);
                        const saldoTipo = (Number(tipo.orcamento) || 0) - totalTipo;
                        const percentual = (Number(tipo.orcamento) || 0) > 0
                          ? Math.min(100, (totalTipo / Number(tipo.orcamento)) * 100)
                          : 0;

                        return (
                          <div className="mt-2 space-y-1">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                              <div className="bg-slate-50 rounded-lg px-2 py-1">
                                <div className="text-slate-400">Orçamento</div>
                                <div className="font-semibold text-slate-700">{fmtCurrency(tipo.orcamento || 0)}</div>
                              </div>
                              <div className="bg-blue-50 rounded-lg px-2 py-1">
                                <div className="text-slate-400">Total dos itens</div>
                                <div className="font-semibold text-blue-700">{fmtCurrency(totalTipo)}</div>
                              </div>
                              <div className={`rounded-lg px-2 py-1 ${saldoTipo < 0 ? 'bg-red-50' : 'bg-emerald-50'}`}>
                                <div className="text-slate-400">Saldo</div>
                                <div className={`font-semibold ${saldoTipo < 0 ? 'text-red-700' : 'text-emerald-700'}`}>
                                  {fmtCurrency(saldoTipo)}
                                </div>
                              </div>
                            </div>

                            <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                              <div
                                className={`h-2 rounded-full ${
                                  saldoTipo < 0 ? 'bg-red-500' : percentual >= 80 ? 'bg-amber-500' : 'bg-emerald-500'
                                }`}
                                style={{ width: `${Math.min(percentual, 100)}%` }}
                              />
                            </div>
                          </div>
                        );
                      })()}
                    </div>

                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button onClick={()=>startEdit(tipo)} className="p-1.5 rounded-lg hover:bg-blue-50 text-blue-500 text-xs" title="Editar">✏</button>
                      <button onClick={()=>setDelNome(tipo.nome)} className="p-1.5 rounded-lg hover:bg-red-50 text-red-500 text-xs" title="Excluir">🗑</button>
                    </div>
                  </div>
                )}
              </li>
            ))}
          </ul>
        )}
      </div>

      {projectTypes.length > 0 && (
        <p className="text-xs text-slate-400 text-center">
          Os badges coloridos aparecem em Itens, Pagamentos, Relatórios e Visão Geral.
        </p>
      )}

      {delNome && (
        <Confirm
          msg={`Deseja excluir o tipo "${delNome}"? Itens que já usam este tipo não serão afetados.`}
          onYes={()=>remove(delNome)}
          onNo={()=>setDelNome(null)}
        />
      )}
    </div>
  );
}

// ─── RUBRICAS TAB ────────────────────────────────────────────────────────────

function RubricasTab({ rubricas, items, onUpdateRubricas, toast }) {
  const [newName, setNewName] = useState('');
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState('');
  const [delId, setDelId] = useState(null);

  const add = () => {
    const nome = newName.trim();
    if (!nome) return;
    if (rubricas.some(r => r.nome === nome)) {
      toast('Essa rubrica já existe.', 'error');
      return;
    }
    onUpdateRubricas([...rubricas, { id: genId(), nome }]);
    setNewName('');
    toast('Rubrica adicionada!');
  };

  const startEdit = r => {
    setEditId(r.id);
    setEditName(r.nome);
  };

  const saveEdit = () => {
    const nome = editName.trim();
    if (!nome) return;
    if (rubricas.some(r => r.nome === nome && r.id !== editId)) {
      toast('Já existe uma rubrica com esse nome.', 'error');
      return;
    }
    onUpdateRubricas(rubricas.map(r => r.id === editId ? { ...r, nome } : r));
    setEditId(null);
    setEditName('');
    toast('Rubrica atualizada!');
  };

  const remove = id => {
    onUpdateRubricas(rubricas.filter(r => r.id !== id));
    setDelId(null);
    toast('Rubrica removida.', 'error');
  };

  return (
    <div className="max-w-3xl space-y-5">
      <div className="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
        <h3 className="text-sm font-semibold text-slate-700">Adicionar nova rubrica</h3>
        <div className="flex gap-2">
          <input
            className={inputCls + " flex-1"}
            value={newName}
            onChange={e => setNewName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && add()}
            placeholder="Ex.: Capital, Custeio, Bolsa..."
          />
          <button
            onClick={add}
            className="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 font-medium"
          >
            + Adicionar
          </button>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
        <div className="px-5 py-3 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
          <span className="text-sm font-semibold text-slate-700">Rubricas do projeto</span>
          <span className="text-xs text-slate-400 bg-white border border-slate-200 px-2 py-0.5 rounded-full">
            {rubricas.length} {rubricas.length === 1 ? 'rubrica' : 'rubricas'}
          </span>
        </div>

        {rubricas.length === 0 ? (
          <div className="text-center py-10 text-slate-400">
            <div className="text-3xl mb-2">💼</div>
            <div className="text-sm font-medium">Nenhuma rubrica cadastrada</div>
          </div>
        ) : (
          <ul className="divide-y divide-slate-50">
            {rubricas.map((rubrica, idx) => {
              const itensDaRubrica = items.filter(i => i.rubrica === rubrica.nome);
              const total = itensDaRubrica.reduce((s, i) => s + i.valor_total_aprovado, 0);

              return (
                <li key={rubrica.id} className="px-5 py-3 hover:bg-slate-50 transition-colors">
                  {editId === rubrica.id ? (
                    <div className="flex gap-2">
                      <input
                        className={inputCls + " flex-1 py-1.5"}
                        value={editName}
                        onChange={e => setEditName(e.target.value)}
                        onKeyDown={e => {
                          if (e.key === 'Enter') saveEdit();
                          if (e.key === 'Escape') setEditId(null);
                        }}
                        autoFocus
                      />
                      <button onClick={saveEdit} className="px-3 py-1.5 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Salvar</button>
                      <button onClick={() => setEditId(null)} className="px-3 py-1.5 text-xs border border-slate-200 rounded-lg hover:bg-slate-100 text-slate-600">✕</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-3">
                      <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-xs flex items-center justify-center font-semibold flex-shrink-0">
                        {idx + 1}
                      </span>

                      <div className="flex-1">
                        <div className="font-medium text-slate-700">{rubrica.nome}</div>
                        <div className="text-xs text-slate-400 mt-1">
                          {itensDaRubrica.length} itens · Total aprovado: {fmtCurrency(total)}
                        </div>
                      </div>

                      <div className="flex gap-1">
                        <button onClick={() => startEdit(rubrica)} className="p-1.5 rounded-lg hover:bg-blue-50 text-blue-500 text-xs" title="Editar">✏</button>
                        <button onClick={() => setDelId(rubrica.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-red-500 text-xs" title="Excluir">🗑</button>
                      </div>
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
        )}
      </div>

      {delId && (
        <Confirm
          msg="Deseja excluir esta rubrica? Os itens existentes não serão apagados, mas continuarão com o nome salvo neles."
          onYes={() => remove(delId)}
          onNo={() => setDelId(null)}
        />
      )}
    </div>
  );
}

// ─── OVERVIEW TAB ────────────────────────────────────────────────────────────

function OverviewTab({ project, items, projectTypes }) {
  const totalAprov = items.reduce((s,i)=>s+i.valor_total_aprovado,0);
  const totalPago  = items.reduce((s,i)=>s+i.valor_total_pago,0);
  const saldo      = totalAprov - totalPago;
  const pagos      = items.filter(i=>i.pago).length;
  const atrasados  = items.filter(i=>itemStatus(i)==='atrasado').length;
  const pctPago    = totalAprov>0 ? ((totalPago/totalAprov)*100).toFixed(1) : 0;

  const byTipo = {};
  items.forEach(i => { byTipo[i.tipo_item] = (byTipo[i.tipo_item]||0) + i.valor_total_aprovado; });
  const byRubrica = {};
  items.forEach(i => { byRubrica[i.rubrica] = (byRubrica[i.rubrica]||0) + i.valor_total_aprovado; });

  const tipoLabels = Object.keys(byTipo);
  const tipoColors = tipoLabels.map(n => getTypeColor(n, projectTypes).hex);

  const tipoData = {
    labels: tipoLabels,
    datasets:[{ data:Object.values(byTipo), backgroundColor:tipoColors, borderWidth:2, borderColor:'#fff' }]
  };

  const rubricaData = {
    labels: Object.keys(byRubrica),
    datasets:[{ label:'Aprovado (R$)', data:Object.values(byRubrica), backgroundColor:'#3b82f6', borderRadius:6 }]
  };

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="Total Aprovado" value={fmtCurrency(totalAprov)} color="blue" icon="📋" />
        <StatCard label="Total Pago" value={fmtCurrency(totalPago)} sub={`${pctPago}% realizado`} color="green" icon="✅" />
        <StatCard label="Saldo Disponível" value={fmtCurrency(saldo)} color={saldo<0?'red':'amber'} icon="💰" />
        <StatCard label="Itens Cadastrados" value={items.length} sub={`${pagos} pagos · ${items.length-pagos} pendentes`} color="purple" icon="📦" />
      </div>

      {atrasados > 0 && (
        <div className="flex items-center gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm">
          <span className="text-lg">⚠️</span>
          <span><strong>{atrasados} {atrasados===1?'item':'itens'}</strong> com prazo vencido e ainda não {atrasados===1?'pago':'pagos'}!</span>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-100 p-5">
        <h3 className="font-semibold text-slate-700 mb-3 text-sm uppercase tracking-wide">Informações do Projeto</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          {[
            ['Coordenador',project.coordenador],
            ['Instituição',project.instituicao],
            ['Tipo',project.tipo],
            ['Data de Criação',fmtDate(project.data_criacao)]
          ].map(([k,v])=>(
            <div key={k}>
              <span className="text-slate-400 text-xs uppercase">{k}</span>
              <div className="font-medium text-slate-700">{v||'–'}</div>
            </div>
          ))}
        </div>
        {project.observacoes && (
          <div className="mt-3 pt-3 border-t border-slate-100 text-sm text-slate-600">
            <span className="text-xs text-slate-400 uppercase block mb-1">Observações</span>
            {project.observacoes}
          </div>
        )}
      </div>

      {projectTypes.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-100 p-5">
          <h3 className="font-semibold text-slate-700 mb-3 text-sm">Tipos deste projeto</h3>
          <div className="flex flex-wrap gap-2">
            {projectTypes.map(t => (
              <TypeBadge key={t.id} nome={t.nome} projectTypes={projectTypes} />
            ))}
          </div>
        </div>
      )}

      {items.length > 0 && (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div className="bg-white rounded-xl border border-slate-100 p-5">
            <h3 className="font-semibold text-slate-700 mb-4 text-sm">Distribuição por Tipo de Item</h3>
            <ChartBox
              type="doughnut"
              data={tipoData}
              height={220}
              options={{plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:10}}}}}}
            />
          </div>

          <div className="bg-white rounded-xl border border-slate-100 p-5">
            <h3 className="font-semibold text-slate-700 mb-4 text-sm">Valor Aprovado por Rubrica</h3>
            <ChartBox
              type="bar"
              data={rubricaData}
              height={220}
              options={{
                plugins:{legend:{display:false}},
                scales:{y:{ticks:{callback:v=>'R$'+Number(v).toLocaleString('pt-BR')}}}
              }}
            />
          </div>
        </div>
      )}

      {projectTypes.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-100 p-5">
          <h3 className="font-semibold text-slate-700 mb-4 text-sm">Orçamento por Tipo</h3>
          <div className="space-y-3">
            {projectTypes.map(tipo => {
              const itensDoTipo = items.filter(i => i.tipo_item === tipo.nome);
              const totalTipo = itensDoTipo.reduce((s, i) => s + i.valor_total_aprovado, 0);
              const saldoTipo = (Number(tipo.orcamento) || 0) - totalTipo;
              const percentual = (Number(tipo.orcamento) || 0) > 0
                ? Math.min(100, (totalTipo / Number(tipo.orcamento)) * 100)
                : 0;

              return (
                <div key={tipo.id} className="border border-slate-100 rounded-xl p-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
                    <TypeBadge nome={tipo.nome} projectTypes={projectTypes} />
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs sm:text-sm w-full sm:w-auto">
                      <div className="bg-slate-50 rounded-lg px-3 py-2">
                        <div className="text-slate-400">Orçamento</div>
                        <div className="font-semibold text-slate-700">{fmtCurrency(tipo.orcamento || 0)}</div>
                      </div>
                      <div className="bg-blue-50 rounded-lg px-3 py-2">
                        <div className="text-slate-400">Total dos itens</div>
                        <div className="font-semibold text-blue-700">{fmtCurrency(totalTipo)}</div>
                      </div>
                      <div className={`rounded-lg px-3 py-2 ${saldoTipo < 0 ? 'bg-red-50' : 'bg-emerald-50'}`}>
                        <div className="text-slate-400">Saldo</div>
                        <div className={`font-semibold ${saldoTipo < 0 ? 'text-red-700' : 'text-emerald-700'}`}>
                          {fmtCurrency(saldoTipo)}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div
                      className={`h-2 rounded-full ${
                        saldoTipo < 0 ? 'bg-red-500' : percentual >= 80 ? 'bg-amber-500' : 'bg-emerald-500'
                      }`}
                      style={{ width: `${Math.min(percentual, 100)}%` }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ITEMS TAB ───────────────────────────────────────────────────────────────

function ItemsTab({ items, projectTypes, projectRubricas, onAdd, onEdit, onDelete, onAddType, toast }) {
  const [search, setSearch] = useState('');
  const [filters, setFilters] = useState({ tipo:'', rubrica:'', status:'', fornecedor:'' });
  const [sort, setSort] = useState({ col:'data_solicitacao', dir:'desc' });
  const [editItem, setEditItem] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [delId, setDelId] = useState(null);
  const [showFilters, setShowFilters] = useState(false);

  const tiposUsados = [...new Set(items.map(i=>i.tipo_item))];
  const rubricas = [...new Set(items.map(i=>i.rubrica))];
  const fornecedores = [...new Set(items.map(i=>i.fornecedor).filter(Boolean))];

  const filtered = useMemo(() => {
    let r = items;
    if (search) r = r.filter(i=>JSON.stringify(i).toLowerCase().includes(search.toLowerCase()));
    if (filters.tipo) r = r.filter(i=>i.tipo_item===filters.tipo);
    if (filters.rubrica) r = r.filter(i=>i.rubrica===filters.rubrica);
    if (filters.status) r = r.filter(i=>itemStatus(i)===filters.status);
    if (filters.fornecedor) r = r.filter(i=>i.fornecedor===filters.fornecedor);

    return [...r].sort((a,b)=>{
      let va = a[sort.col], vb = b[sort.col];
      if (typeof va === 'string') {
        va = va.toLowerCase();
        vb = (vb||'').toLowerCase();
      }
      return va<vb ? (sort.dir==='asc'?-1:1) : va>vb ? (sort.dir==='asc'?1:-1) : 0;
    });
  }, [items, search, filters, sort]);

  const toggleSort = col => setSort(s=>({ col, dir:s.col===col&&s.dir==='asc'?'desc':'asc' }));
  const SortIcon   = ({col}) => sort.col===col ? (sort.dir==='asc'?'↑':'↓') : <span className="opacity-30">↕</span>;

  const totalAprov = filtered.reduce((s,i)=>s+i.valor_total_aprovado,0);
  const totalPago  = filtered.reduce((s,i)=>s+i.valor_total_pago,0);

  const handleSave = (data, novoTipo) => {
    if (novoTipo && !projectTypes.some(t=>t.nome===novoTipo)) {
      const cor = autoColor(projectTypes.length);
      onAddType({ id:genId(), nome:novoTipo, cor, orcamento:0 });
      toast(`Tipo "${novoTipo}" salvo na lista!`);
    }

    if (editItem) {
      onEdit(data);
      toast('Item atualizado!');
    } else {
      onAdd(data);
      toast('Item adicionado!');
    }

    setEditItem(null);
    setAddOpen(false);
  };

  const thCls = "px-3 py-2.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide cursor-pointer hover:text-slate-800 whitespace-nowrap select-none";
  const tdCls = "px-3 py-2.5 text-sm text-slate-700 whitespace-nowrap";

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="relative flex-1 min-w-[180px]">
          <span className="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
          <input
            className="w-full pl-8 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Buscar itens..."
            value={search}
            onChange={e=>setSearch(e.target.value)}
          />
        </div>

        <button
          onClick={()=>setShowFilters(p=>!p)}
          className={`flex items-center gap-1.5 px-3 py-2 text-sm rounded-lg border transition ${showFilters?'bg-blue-600 text-white border-blue-600':'border-slate-200 hover:bg-slate-50'}`}
        >
          ⚙ Filtros
        </button>

        <button
          onClick={()=>setAddOpen(true)}
          className="flex items-center gap-1.5 px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
        >
          + Novo Item
        </button>
      </div>

      {showFilters && (
        <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 grid grid-cols-2 sm:grid-cols-4 gap-3 animate-fade">
          {[
            ['Tipo','tipo',tiposUsados],
            ['Rubrica','rubrica',rubricas],
            ['Status','status',['pago','pendente','atrasado']],
            ['Fornecedor','fornecedor',fornecedores]
          ].map(([label,key,opts])=>(
            <div key={key}>
              <label className="block text-xs text-slate-500 mb-1">{label}</label>
              <select
                className="w-full text-sm border border-slate-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                value={filters[key]}
                onChange={e=>setFilters(p=>({...p,[key]:e.target.value}))}
              >
                <option value="">Todos</option>
                {opts.map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          ))}
          <button onClick={()=>setFilters({tipo:'',rubrica:'',status:'',fornecedor:''})} className="text-xs text-red-500 hover:underline self-end mb-1">Limpar</button>
        </div>
      )}

      {filtered.length > 0 && (
        <div className="flex flex-wrap gap-3 text-sm">
          <span className="bg-blue-50 text-blue-700 px-3 py-1 rounded-full">{filtered.length} {filtered.length===1?'item':'itens'}</span>
          <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Aprovado: <strong>{fmtCurrency(totalAprov)}</strong></span>
          <span className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full">Pago: <strong>{fmtCurrency(totalPago)}</strong></span>
          <span className={`px-3 py-1 rounded-full ${totalAprov-totalPago<0?'bg-red-50 text-red-700':'bg-amber-50 text-amber-700'}`}>
            Saldo: <strong>{fmtCurrency(totalAprov-totalPago)}</strong>
          </span>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-100 table-scroll">
        {filtered.length===0 ? (
          <div className="text-center py-16 text-slate-400">
            <div className="text-4xl mb-2">📋</div>
            <div className="font-medium">Nenhum item encontrado</div>
            <div className="text-sm mt-1">Clique em "+ Novo Item" para adicionar</div>
          </div>
        ) : (
          <table className="w-full min-w-[900px]">
            <thead className="bg-slate-50 border-b border-slate-100">
              <tr>
                {[
                  ['tipo_item','Tipo'],
                  ['descricao','Descrição'],
                  ['quantidade','Qtd'],
                  ['valor_total_aprovado','Aprov.'],
                  ['rubrica','Rubrica'],
                  ['valor_total_pago','Pago'],
                  ['saldo','Saldo'],
                  ['data_solicitacao','Solicitação'],
                  ['fornecedor','Fornecedor'],
                  ['previsao_entrega','Prev. Entrega'],
                  ['nf','NF'],
                  ['status','Status']
                ].map(([col,lbl])=>(
                  <th key={col} className={thCls} onClick={()=>col!=='status'&&toggleSort(col)}>
                    {lbl} {col!=='status'&&<SortIcon col={col}/>}
                  </th>
                ))}
                <th className="px-3 py-2.5 text-xs text-slate-500 uppercase">Ações</th>
              </tr>
            </thead>

            <tbody className="divide-y divide-slate-50">
              {filtered.map(item => {
                const st = itemStatus(item);
                return (
                  <tr key={item.id} className="hover:bg-slate-50/60 transition-colors">
                    <td className={tdCls}>
                      <TypeBadge nome={item.tipo_item} projectTypes={projectTypes} />
                    </td>
                    <td className={tdCls + " max-w-[180px]"}>
                      <div className="truncate font-medium" title={item.descricao}>{item.descricao}</div>
                      {item.numero_pedido_of && <div className="text-xs text-slate-400">{item.numero_pedido_of}</div>}
                    </td>
                    <td className={tdCls + " text-center"}>{item.quantidade}</td>
                    <td className={tdCls}>{fmtCurrency(item.valor_total_aprovado)}</td>
                    <td className={tdCls}><span className="text-xs bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full">{item.rubrica}</span></td>
                    <td className={tdCls}>{fmtCurrency(item.valor_total_pago)}</td>
                    <td className={tdCls}><span className={item.saldo<0?'text-red-600 font-semibold':''}>{fmtCurrency(item.saldo)}</span></td>
                    <td className={tdCls}>{fmtDate(item.data_solicitacao)}</td>
                    <td className={tdCls + " max-w-[120px]"}><div className="truncate" title={item.fornecedor}>{item.fornecedor||'–'}</div></td>
                    <td className={tdCls}><span className={isLate(item)&&!item.pago?'text-red-600 font-medium':''}>{fmtDate(item.previsao_entrega)}</span></td>
                    <td className={tdCls}><span className="text-xs text-slate-500">{item.nf||'–'}</span></td>
                    <td className={tdCls}><StatusBadge status={st} /></td>
                    <td className="px-3 py-2.5">
                      <div className="flex items-center gap-1">
                        <button onClick={()=>setEditItem(item)} className="p-1.5 rounded-lg hover:bg-blue-50 text-blue-500 text-xs" title="Editar">✏</button>
                        <button onClick={()=>setDelId(item.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-red-500 text-xs" title="Excluir">🗑</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {addOpen && (
        <Modal title="Novo Item" wide onClose={()=>setAddOpen(false)}>
          <ItemForm
            projectTypes={projectTypes}
            projectRubricas={projectRubricas}
            onSave={handleSave}
            onCancel={()=>setAddOpen(false)}
          />
        </Modal>
      )}

      {editItem && (
        <Modal title="Editar Item" wide onClose={()=>setEditItem(null)}>
          <ItemForm
            item={editItem}
            projectTypes={projectTypes}
            projectRubricas={projectRubricas}
            onSave={handleSave}
            onCancel={()=>setEditItem(null)}
          />
        </Modal>
      )}

      {delId && (
        <Confirm
          msg="Tem certeza que deseja excluir este item? Essa ação não pode ser desfeita."
          onYes={()=>{ onDelete(delId); setDelId(null); toast('Item excluído.','error'); }}
          onNo={()=>setDelId(null)}
        />
      )}
    </div>
  );
}

// ─── PAYMENTS TAB ────────────────────────────────────────────────────────────

function PaymentsTab({ items, projectTypes, onTogglePaid, toast }) {
  const [filter, setFilter] = useState('all');
  const shown = filter==='all' ? items : items.filter(i=>filter==='paid'?i.pago:!i.pago);
  const sorted = [...shown].sort((a,b)=>(a.data_solicitacao||'').localeCompare(b.data_solicitacao||''));

  return (
    <div className="space-y-4">
      <div className="flex gap-2 flex-wrap">
        {[['all','Todos'],['pending','Pendentes'],['paid','Pagos']].map(([v,l])=>(
          <button
            key={v}
            onClick={()=>setFilter(v)}
            className={`px-4 py-1.5 rounded-full text-sm font-medium transition ${filter===v?'bg-blue-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
          >
            {l} ({v==='all'?items.length:v==='paid'?items.filter(i=>i.pago).length:items.filter(i=>!i.pago).length})
          </button>
        ))}
      </div>

      <div className="space-y-2">
        {sorted.length===0 && <div className="text-center py-10 text-slate-400">Nenhum item nesta categoria</div>}

        {sorted.map(item=>{
          const st=itemStatus(item);
          return (
            <div
              key={item.id}
              className={`bg-white rounded-xl border p-4 flex flex-wrap items-center gap-4 transition
                ${st==='atrasado'?'border-red-200':st==='pago'?'border-emerald-100':'border-slate-100'}`}
            >
              <div className="flex-1 min-w-[180px]">
                <div className="flex items-center gap-2 flex-wrap mb-0.5">
                  <TypeBadge nome={item.tipo_item} projectTypes={projectTypes} />
                </div>
                <div className="font-medium text-sm text-slate-800 mt-1">{item.descricao}</div>
                <div className="text-xs text-slate-400">{item.fornecedor||'–'}</div>
              </div>

              <div className="text-center">
                <div className="text-xs text-slate-400">Aprovado</div>
                <div className="font-semibold text-sm">{fmtCurrency(item.valor_total_aprovado)}</div>
              </div>

              <div className="text-center">
                <div className="text-xs text-slate-400">Pago</div>
                <div className="font-semibold text-sm text-emerald-700">{fmtCurrency(item.valor_total_pago)}</div>
              </div>

              <div className="text-center">
                <div className="text-xs text-slate-400">Prev. Entrega</div>
                <div className={`text-sm font-medium ${isLate(item)&&!item.pago?'text-red-600':''}`}>{fmtDate(item.previsao_entrega)}</div>
              </div>

              <div className="text-center">
                <div className="text-xs text-slate-400">NF</div>
                <div className="text-sm">{item.nf||'–'}</div>
              </div>

              <StatusBadge status={st} />

              <button
                onClick={()=>{ onTogglePaid(item.id); toast(item.pago?'Marcado como pendente.':'Marcado como pago!'); }}
                className={`px-3 py-1.5 text-xs rounded-lg font-medium transition ${item.pago?'bg-amber-50 text-amber-700 hover:bg-amber-100':'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'}`}
              >
                {item.pago?'↩ Desfazer':'✓ Confirmar Pgto'}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── SUPPLIERS TAB ───────────────────────────────────────────────────────────

function SuppliersTab({ items, projectTypes }) {
  const data = useMemo(()=>{
    const map={};
    items.forEach(i=>{
      const k=i.fornecedor||'(sem fornecedor)';
      if (!map[k]) map[k]={nome:k,pedidos:0,aprov:0,pago:0,itens:[]};
      map[k].pedidos++;
      map[k].aprov+=i.valor_total_aprovado;
      map[k].pago+=i.valor_total_pago;
      map[k].itens.push(i);
    });
    return Object.values(map).sort((a,b)=>b.aprov-a.aprov);
  },[items]);

  if (!data.length) return <div className="text-center py-16 text-slate-400">Nenhum fornecedor cadastrado ainda.</div>;

  return (
    <div className="space-y-3">
      {data.map(s=>(
        <div key={s.nome} className="bg-white rounded-xl border border-slate-100 p-5">
          <div className="flex flex-wrap items-start justify-between gap-3 mb-3">
            <div>
              <div className="font-semibold text-slate-800">{s.nome}</div>
              <div className="text-xs text-slate-400 mt-0.5">{s.pedidos} {s.pedidos===1?'pedido':'pedidos'}</div>
            </div>

            <div className="flex gap-4 text-right">
              <div>
                <div className="text-xs text-slate-400">Total Aprovado</div>
                <div className="font-bold text-blue-700">{fmtCurrency(s.aprov)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400">Total Pago</div>
                <div className="font-bold text-emerald-700">{fmtCurrency(s.pago)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400">Saldo</div>
                <div className={`font-bold ${s.aprov-s.pago<0?'text-red-600':'text-amber-700'}`}>{fmtCurrency(s.aprov-s.pago)}</div>
              </div>
            </div>
          </div>

          <div className="w-full bg-slate-100 rounded-full h-1.5 mb-3">
            <div className="bg-emerald-500 h-1.5 rounded-full transition-all" style={{width:s.aprov>0?Math.min(100,(s.pago/s.aprov*100))+'%':'0%'}} />
          </div>

          <div className="flex flex-wrap gap-1.5">
            {s.itens.map(i=>(
              <span
                key={i.id}
                className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border ${getTypeColor(i.tipo_item,projectTypes).bg} ${getTypeColor(i.tipo_item,projectTypes).text}`}
              >
                <span className={`w-1.5 h-1.5 rounded-full ${getTypeColor(i.tipo_item,projectTypes).dot}`} />
                {i.descricao} · {fmtCurrency(i.valor_total_aprovado)}
              </span>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── REPORTS TAB ─────────────────────────────────────────────────────────────

function ReportsTab({ project, items, projectTypes }) {
  const totalAprov = items.reduce((s,i)=>s+i.valor_total_aprovado,0);
  const totalPago  = items.reduce((s,i)=>s+i.valor_total_pago,0);
  const saldo      = totalAprov - totalPago;

  const byTipo = useMemo(()=>{
    const m={};
    items.forEach(i=>{
      if(!m[i.tipo_item]) m[i.tipo_item]={aprov:0,pago:0,qtd:0};
      m[i.tipo_item].aprov+=i.valor_total_aprovado;
      m[i.tipo_item].pago+=i.valor_total_pago;
      m[i.tipo_item].qtd++;
    });
    return m;
  },[items]);

  const byRubrica = useMemo(()=>{
    const m={};
    items.forEach(i=>{
      if(!m[i.rubrica]) m[i.rubrica]={aprov:0,pago:0,qtd:0};
      m[i.rubrica].aprov+=i.valor_total_aprovado;
      m[i.rubrica].pago+=i.valor_total_pago;
      m[i.rubrica].qtd++;
    });

  const Section = ({title,children}) => (

        <h3 className="font-semibold text-slate-700 text-sm">{title}</h3>
      </div>
      <div className="p-5">{children}</div>

  const thR = "text-xs font-semibold text-slate-400 uppercase py-2";

  return (
    <div className="space-y-5">
      <div className="bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl p-5 text-white">
        <div className="text-xs uppercase opacity-75 mb-1">Relatório Financeiro</div>
        <div className="text-xl font-bold">{project.nome}</div>
        <div className="text-sm opacity-80 mt-1">{project.coordenador} · {project.instituicao}</div>
        <div className="text-xs opacity-60 mt-0.5">Gerado em {fmtDate(todayISO())}</div>
      </div>

      <div className="grid grid-cols-3 gap-3">
        <StatCard label="Total Aprovado" value={fmtCurrency(totalAprov)} color="blue" />
        <StatCard label="Total Pago" value={fmtCurrency(totalPago)} color="green" />
        <StatCard label="Saldo Restante" value={fmtCurrency(saldo)} color={saldo<0?'red':'amber'} />
      </div>

      <Section title="Resumo por Tipo de Item">
        <table className="w-full">
          <thead>
            <tr>
              <th className={thR+" text-left"}>Tipo</th>
              <th className={thR+" text-center"}>Qtd</th>
              <th className={thR+" text-right"}>Aprovado</th>
              <th className={thR+" text-right"}>Pago</th>
              <th className={thR+" text-right"}>Saldo</th>
            </tr>
          </thead>
          <tbody>
            {Object.entries(byTipo).map(([t,v])=>(
              <tr key={t} className="border-b border-slate-50 hover:bg-slate-50">
                <td className="py-2"><TypeBadge nome={t} projectTypes={projectTypes} /></td>
                <td className="py-2 text-sm text-center text-slate-500">{v.qtd}</td>
                <td className="py-2 text-sm text-right font-medium">{fmtCurrency(v.aprov)}</td>
                <td className="py-2 text-sm text-right text-emerald-700 font-medium">{fmtCurrency(v.pago)}</td>
                <td className={`py-2 text-sm text-right font-semibold ${v.aprov-v.pago<0?'text-red-600':'text-amber-700'}`}>{fmtCurrency(v.aprov-v.pago)}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="bg-slate-50">
              <td className="py-2 font-bold text-sm">Total</td>
              <td className="py-2 text-center text-sm">{items.length}</td>
              <td className="py-2 text-right font-bold text-sm">{fmtCurrency(totalAprov)}</td>
              <td className="py-2 text-right font-bold text-sm text-emerald-700">{fmtCurrency(totalPago)}</td>

      <Section title="Resumo por Rubrica">

          <thead>
            <tr>
              <th className={thR+" text-left"}>Rubrica</th>
              <th className={thR+" text-center"}>Itens</th>
              <th className={thR+" text-right"}>Aprovado</th>
              <th className={thR+" text-right"}>Pago</th>
