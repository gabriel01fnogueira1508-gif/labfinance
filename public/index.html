// ─── EXPORT TAB ──────────────────────────────────────────────────────────────

function ExportTab({
  project,
  items,
  projectTypes,
  projectRubricas,
  onImportItems,
  onImportTypes,
  onImportRubricas,
  toast
}) {
  const exportExcel = () => {
    try {
      const wb = XLSX.utils.book_new();
      const header = [
        ['CONTROLE FINANCEIRO DE PROJETO'],
        [`Projeto: ${project.nome}`],
        [`Coordenador: ${project.coordenador}`],
        [`Instituição: ${project.instituicao}`],
        [`Tipo: ${project.tipo}`],
        [`Data de Criação: ${fmtDate(project.data_criacao)}`],
        [`Exportado em: ${fmtDate(todayISO())}`],
        [],
        ['Tipo','Descrição','Qtd','V.Unit.Aprov (R$)','V.Total.Aprov (R$)','Rubrica','V.Unit.Pago (R$)','V.Total.Pago (R$)','Saldo (R$)','Nº Pedido/OF','Data Solicitação','Fornecedor','Prev. Entrega','NF','Pago?','Observações'],
        ...items.map(i=>[
          i.tipo_item,
          i.descricao,
          i.quantidade,
          i.valor_unitario_aprovado,
          i.valor_total_aprovado,
          i.rubrica,
          i.valor_unitario_pago,
          i.valor_total_pago,
          i.saldo,
          i.numero_pedido_of,
          fmtDate(i.data_solicitacao),
          i.fornecedor,
          fmtDate(i.previsao_entrega),
          i.nf,
          i.pago?'Sim':'Não',
          i.observacoes
        ]),
        [],
        ['','','','TOTAL APROVADO:',items.reduce((s,i)=>s+i.valor_total_aprovado,0),'','','TOTAL PAGO:',items.reduce((s,i)=>s+i.valor_total_pago,0)],
      ];
      const ws = XLSX.utils.aoa_to_sheet(header);
      ws['!cols'] = [8,30,6,14,14,10,14,14,12,12,12,20,12,10,6,25].map(w=>({wch:w}));
      XLSX.utils.book_append_sheet(wb, ws, 'Itens');

      const resumoTipos = [
        ['RESUMO POR TIPO'],
        ['Tipo','Orçamento','Total dos Itens','Saldo']
      ];
      projectTypes.forEach(t => {
        const totalTipo = items.filter(i => i.tipo_item === t.nome).reduce((s,i)=>s+i.valor_total_aprovado,0);
        resumoTipos.push([t.nome, t.orcamento || 0, totalTipo, (Number(t.orcamento)||0)-totalTipo]);
      });
      const ws2 = XLSX.utils.aoa_to_sheet(resumoTipos);
      XLSX.utils.book_append_sheet(wb, ws2, 'Resumo por Tipo');

      const resumoRubricas = [
        ['RUBRICAS DO PROJETO'],
        ['Rubrica','Qtd Itens','Total Aprovado']
      ];
      projectRubricas.forEach(r => {
        const itensDaRubrica = items.filter(i => i.rubrica === r.nome);
        const total = itensDaRubrica.reduce((s,i)=>s+i.valor_total_aprovado,0);
        resumoRubricas.push([r.nome, itensDaRubrica.length, total]);
      });
      const ws3 = XLSX.utils.aoa_to_sheet(resumoRubricas);
      XLSX.utils.book_append_sheet(wb, ws3, 'Rubricas');

      XLSX.writeFile(wb, `${project.nome.replace(/[^a-zA-Z0-9 ]/g,'_')} - Financeiro.xlsx`);
      toast('Planilha Excel exportada!');
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  };

  const exportPDF = () => {
    try {
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      const pw=doc.internal.pageSize.getWidth();
      doc.setFillColor(37,99,235);
      doc.rect(0,0,pw,28,'F');

      doc.setTextColor(255,255,255);
      doc.setFontSize(14);
      doc.setFont(undefined,'bold');
      doc.text('CONTROLE FINANCEIRO DE PROJETO',pw/2,10,{align:'center'});
      doc.setFontSize(10);
      doc.setFont(undefined,'normal');
      doc.text(project.nome,pw/2,17,{align:'center'});
      doc.setFontSize(8);
      doc.text(`${project.coordenador}  ·  ${project.instituicao}  ·  ${project.tipo}`,pw/2,23,{align:'center'});

      doc.setTextColor(0,0,0);
      const tA=items.reduce((s,i)=>s+i.valor_total_aprovado,0), tP=items.reduce((s,i)=>s+i.valor_total_pago,0);
      doc.text(`Total Aprovado: ${fmtCurrency(tA)}    Total Pago: ${fmtCurrency(tP)}    Saldo: ${fmtCurrency(tA-tP)}    Exportado: ${fmtDate(todayISO())}`,14,34);

      doc.autoTable({
        startY:38,
        head:[['Tipo','Descrição','Qtd','V.Aprov','Rubrica','V.Pago','Saldo','Pedido/OF','Solicitação','Fornecedor','Prev.Entrega','NF','Pago?']],
        body:items.map(i=>[
          i.tipo_item,
          i.descricao,
          i.quantidade,
          fmtCurrency(i.valor_total_aprovado),
          i.rubrica,
          fmtCurrency(i.valor_total_pago),
          fmtCurrency(i.saldo),
          i.numero_pedido_of||'–',
          fmtDate(i.data_solicitacao),
          i.fornecedor||'–',
          fmtDate(i.previsao_entrega),
          i.nf||'–',
          i.pago?'Sim':'Não'
        ]),
        styles:{fontSize:7,cellPadding:2},
        headStyles:{fillColor:[37,99,235],fontSize:7,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,250,252]},
        columnStyles:{1:{cellWidth:35},9:{cellWidth:28},3:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
        didParseCell:d=>{
          if(d.section==='body'){
            const it=items[d.row.index];
            if(it&&d.column.index===12){
              const st=itemStatus(it);
              if(st==='pago') d.cell.styles.textColor=[5,150,105];
              else if(st==='atrasado') d.cell.styles.textColor=[220,38,38];
              else d.cell.styles.textColor=[180,120,0];
            }
          }
        }
      });

      doc.save(`${project.nome.replace(/[^a-zA-Z0-9 ]/g,'_')} - Financeiro.pdf`);
      toast('PDF exportado!');
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  };

  const importExcel = async (file) => {
    try {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

      if (!json.length) {
        toast('A planilha está vazia.', 'error');
        return;
      }

      const normalize = str =>
        String(str || '')
          .trim()
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');

      const getValue = (row, possibleKeys) => {
        const rowKeys = Object.keys(row);
        for (const wanted of possibleKeys) {
          const found = rowKeys.find(k => normalize(k) === normalize(wanted));
          if (found) return row[found];
        }
        return '';
      };

      const importedItems = json.map(row => {
        const tipo_item = String(getValue(row, ['Tipo', 'Tipo do item', 'tipo_item']) || '').trim();
        const descricao = String(getValue(row, ['Descrição', 'Descricao', 'Descrição do item', 'descricao']) || '').trim();
        const quantidade = Number(getValue(row, ['Qtd', 'Quantidade', 'quantidade'])) || 0;
        const valor_unitario_aprovado = currencyToNumber(getValue(row, ['V.Unit.Aprov (R$)', 'Valor unitário aprovado', 'valor_unitario_aprovado']));
        const valor_unitario_pago = currencyToNumber(getValue(row, ['V.Unit.Pago (R$)', 'Valor unitário pago', 'valor_unitario_pago']));
        const valor_total_aprovado = quantidade * valor_unitario_aprovado;
        const valor_total_pago = quantidade * valor_unitario_pago;
        const rubrica = String(getValue(row, ['Rubrica', 'rubrica']) || '').trim();
        const saldo = valor_total_aprovado - valor_total_pago;
        const numero_pedido_of = String(getValue(row, ['Nº Pedido/OF', 'Nº Pedido e OF', 'numero_pedido_of']) || '').trim();
        const data_solicitacao = normalizeDateInput(getValue(row, ['Data Solicitação', 'Data da solicitação', 'data_solicitacao']));
        const fornecedor = String(getValue(row, ['Fornecedor', 'fornecedor']) || '').trim();
        const previsao_entrega = normalizeDateInput(getValue(row, ['Prev. Entrega', 'Previsão de entrega', 'previsao_entrega']));
        const nf = String(getValue(row, ['NF', 'nf']) || '').trim();
        const pagoRaw = String(getValue(row, ['Pago?', 'Pago', 'pago']) || '').trim().toLowerCase();
        const pago = ['sim', 'true', '1', 'pago'].includes(pagoRaw);
        const observacoes = String(getValue(row, ['Observações', 'Observacoes', 'observacoes']) || '').trim();

        return {
          id: genId(),
          projeto_id: project.id,
          tipo_item,
          descricao,
          quantidade,
          valor_unitario_aprovado,
          valor_total_aprovado,
          rubrica,
          valor_unitario_pago,
          valor_total_pago,
          saldo,
          numero_pedido_of,
          data_solicitacao,
          fornecedor,
          previsao_entrega,
          nf,
          pago,
          observacoes
        };
      }).filter(item => item.descricao);

      const novosTipos = [...new Set(importedItems.map(i => i.tipo_item).filter(Boolean))]
        .filter(nome => !projectTypes.some(t => t.nome === nome))
        .map((nome, idx) => ({
          id: genId(),
          nome,
          cor: autoColor(projectTypes.length + idx),
          orcamento: 0
        }));

      const novasRubricas = [...new Set(importedItems.map(i => i.rubrica).filter(Boolean))]
        .filter(nome => !projectRubricas.some(r => r.nome === nome))
        .map(nome => ({ id: genId(), nome }));

      onImportItems(importedItems);
      if (novosTipos.length) onImportTypes([...projectTypes, ...novosTipos]);
      if (novasRubricas.length) onImportRubricas([...projectRubricas, ...novasRubricas]);

      toast(`Importação concluída! ${importedItems.length} itens carregados.`);
    } catch (e) {
      toast('Erro ao importar Excel: ' + e.message, 'error');
    }
  };

  const Card = ({icon,title,desc,onClick,color}) => (
    <button
      onClick={onClick}
      className={`flex flex-col items-center gap-3 p-8 rounded-2xl border-2 transition hover:shadow-md w-full ${color==='green'?'border-emerald-200 hover:border-emerald-400 hover:bg-emerald-50':'border-blue-200 hover:border-blue-400 hover:bg-blue-50'}`}
    >
      <span className="text-4xl">{icon}</span>
      <div className="text-center">
        <div className="font-bold text-slate-800">{title}</div>
        <div className="text-sm text-slate-500 mt-1">{desc}</div>
      </div>
    </button>
  );

  return (
    <div className="space-y-6">
      <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700">
        <strong>📤 Exportação e importação:</strong> você pode exportar os <strong>{items.length} itens</strong> do projeto <strong>{project.nome}</strong>
         ou importar uma planilha Excel com colunas parecidas com o sistema.
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <label className="flex flex-col items-center gap-3 p-8 rounded-2xl border-2 transition hover:shadow-md w-full border-purple-200 hover:border-purple-400 hover:bg-purple-50 cursor-pointer">
          <span className="text-4xl">📥</span>
          <div className="text-center">
            <div className="font-bold text-slate-800">Importar Excel (.xlsx)</div>
            <div className="text-sm text-slate-500 mt-1">
              Importa itens da planilha e cria tipos/rubricas automaticamente.
            </div>
          </div>
          <input
            type="file"
            accept=".xlsx,.xls"
            className="hidden"
            onChange={e => {
              const file = e.target.files?.[0];
              if (file) importExcel(file);
              e.target.value = '';
            }}
          />
        </label>

        <Card
          icon="📊"
          title="Exportar para Excel (.xlsx)"
          color="green"
          desc="Planilha completa com todos os campos e resumo por tipo."
          onClick={exportExcel}
        />

        <Card
          icon="📄"
          title="Exportar para PDF"
          color="blue"
          desc="Relatório formatado, ideal para impressão e arquivamento."
          onClick={exportPDF}
        />
      </div>

      <div className="bg-white rounded-xl border border-slate-100 p-5">
        <h3 className="font-semibold text-slate-700 mb-3 text-sm">Pré-visualização</h3>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          {[
            [items.length,'Total de itens','slate'],
            [items.filter(i=>i.pago).length,'Pagos','green'],
            [fmtCurrency(items.reduce((s,i)=>s+i.valor_total_aprovado,0)),'Total aprovado','amber'],
            [fmtCurrency(items.reduce((s,i)=>s+i.valor_total_pago,0)),'Total pago','blue']
          ].map(([v,l,c])=>(
            <div key={l} className={`text-center p-3 rounded-lg ${c==='green'?'bg-emerald-50':c==='amber'?'bg-amber-50':c==='blue'?'bg-blue-50':'bg-slate-50'}`}>
              <div className={`text-xl font-bold ${c==='green'?'text-emerald-700':c==='amber'?'text-amber-700':c==='blue'?'text-blue-700':'text-slate-700'}`}>{v}</div>
              <div className="text-xs text-slate-500 mt-1">{l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── PROJECT DETAIL ──────────────────────────────────────────────────────────

function ProjectDetail({
  project,
  items,
  projectTypes,
  projectRubricas,
  onBack,
  onUpdateItems,
  onUpdateTypes,
  onUpdateRubricas,
  onEditProject,
  toast
}) {
  const [tab, setTab] = useState('overview');

  const recalc = data => {
    const vta = (Number(data.quantidade)||0)*(Number(data.valor_unitario_aprovado)||0);
    const vtp = (Number(data.quantidade)||0)*(Number(data.valor_unitario_pago)||0);
    return { ...data, valor_total_aprovado:vta, valor_total_pago:vtp, saldo:vta-vtp };
  };

  const addItem = (data, novoTipo) => {
    if (novoTipo && !projectTypes.some(t=>t.nome===novoTipo)) {
      onUpdateTypes([...projectTypes, { id:genId(), nome:novoTipo, cor:autoColor(projectTypes.length), orcamento:0 }]);
    }
    onUpdateItems([...items, { ...recalc(data), id:genId(), projeto_id:project.id }]);
  };

  const editItem = (data, novoTipo) => {
    if (novoTipo && !projectTypes.some(t=>t.nome===novoTipo)) {
      onUpdateTypes([...projectTypes, { id:genId(), nome:novoTipo, cor:autoColor(projectTypes.length), orcamento:0 }]);
    }
    onUpdateItems(items.map(i => i.id===data.id ? recalc(data) : i));
  };

  const deleteItem = id => onUpdateItems(items.filter(i=>i.id!==id));

  const togglePaid = id => {
    onUpdateItems(items.map(i=>{
      if (i.id!==id) return i;
      const pago=!i.pago, vtp=pago?i.valor_total_aprovado:0;
      return {
        ...i,
        pago,
        valor_unitario_pago:pago?i.valor_unitario_aprovado:0,
        valor_total_pago:vtp,
        saldo:i.valor_total_aprovado-vtp
      };
    }));
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-3 mb-5 flex-wrap">
        <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800 px-2 py-1.5 rounded-lg hover:bg-slate-100">← Voltar</button>

        <div className="flex-1">
          <h1 className="text-xl font-bold text-slate-800 leading-tight">{project.nome}</h1>
          <div className="text-xs text-slate-400 mt-0.5">{project.tipo} · {project.instituicao}</div>
        </div>

        <button onClick={()=>onEditProject(project)} className="flex items-center gap-1.5 px-3 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-600">
          ✏ Editar Projeto
        </button>
      </div>

      <div className="flex flex-wrap gap-1.5 mb-5 pb-1 border-b border-slate-100 no-print">
        {TABS.map(t=>(
          <button
            key={t}
            onClick={()=>setTab(t)}
            className={`flex items-center gap-1.5 px-3 py-2 text-sm rounded-xl font-medium transition
              ${tab===t?'bg-blue-600 text-white shadow-sm':'text-slate-600 hover:bg-slate-100'}`}
          >
            <span>{TAB_ICONS[t]}</span><span>{TAB_LABELS[t]}</span>
          </button>
        ))}
      </div>

      <div className="flex-1">
        {tab==='overview' && <OverviewTab project={project} items={items} projectTypes={projectTypes} />}

        {tab==='types' && (
          <TypesTab
            projectTypes={projectTypes}
            items={items}
            onUpdateTypes={onUpdateTypes}
            toast={toast}
          />
        )}

        {tab==='rubricas' && (
          <RubricasTab
            rubricas={projectRubricas}
            items={items}
            onUpdateRubricas={onUpdateRubricas}
            toast={toast}
          />
        )}

        {tab==='items' && (
          <ItemsTab
            items={items}
            projectTypes={projectTypes}
            projectRubricas={projectRubricas}
            onAdd={addItem}
            onEdit={editItem}
            onDelete={deleteItem}
            onAddType={t=>onUpdateTypes([...projectTypes,t])}
            toast={toast}
          />
        )}

        {tab==='payments' && (
          <PaymentsTab items={items} projectTypes={projectTypes} onTogglePaid={togglePaid} toast={toast} />
        )}

        {tab==='suppliers' && <SuppliersTab items={items} projectTypes={projectTypes} />}

        {tab==='reports' && <ReportsTab project={project} items={items} projectTypes={projectTypes} />}

        {tab==='export' && (
          <ExportTab
            project={project}
            items={items}
            projectTypes={projectTypes}
            projectRubricas={projectRubricas}
            onImportItems={onUpdateItems}
            onImportTypes={onUpdateTypes}
            onImportRubricas={onUpdateRubricas}
            toast={toast}
          />
        )}
      </div>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────

function Dashboard({ projects, allItems, allTypes, onOpen, onCreate, onEdit, onDelete, toast }) {
  const [search, setSearch] = useState('');
  const [typeFilter, setTypeFilter] = useState('');
  const [delId, setDelId] = useState(null);

  const filtered = useMemo(()=>{
    let r = projects;
    if (search) {
      r = r.filter(p =>
        p.nome.toLowerCase().includes(search.toLowerCase()) ||
        (p.coordenador||'').toLowerCase().includes(search.toLowerCase()) ||
        (p.instituicao||'').toLowerCase().includes(search.toLowerCase())
      );
    }
    if (typeFilter) r = r.filter(p=>p.tipo===typeFilter);
    return [...r].sort((a,b)=>(b.criado_em||'').localeCompare(a.criado_em||''));
  },[projects,search,typeFilter]);

  const allItemsList = Object.values(allItems).flat();
  const totalAprov   = allItemsList.reduce((s,i)=>s+i.valor_total_aprovado,0);
  const totalPago    = allItemsList.reduce((s,i)=>s+i.valor_total_pago,0);
  const atrasados    = allItemsList.filter(i=>itemStatus(i)==='atrasado').length;

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center gap-4 justify-between">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Projetos</h1>
          <p className="text-slate-500 text-sm mt-0.5">{projects.length} {projects.length===1?'projeto':'projetos'} cadastrado{projects.length===1?'':'s'}</p>
        </div>
        <button onClick={onCreate} className="flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium text-sm shadow-sm">
          + Novo Projeto
        </button>
      </div>

      {projects.length > 0 && (
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <StatCard label="Projetos Ativos" value={projects.length} color="blue" icon="📁" />
          <StatCard label="Total Aprovado (Geral)" value={fmtCurrency(totalAprov)} color="purple" icon="💼" />
          <StatCard label="Total Pago (Geral)" value={fmtCurrency(totalPago)} color="green" icon="✅" />
          <StatCard label="Itens Atrasados" value={atrasados} color={atrasados>0?'red':'green'} icon={atrasados>0?'⚠️':'✓'} />
        </div>
      )}

      {projects.length > 0 && (
        <div className="flex flex-wrap gap-2">
          <div className="relative flex-1 min-w-[200px]">
            <span className="absolute left-3 top-2.5 text-slate-400">🔍</span>
            <input
              className="w-full pl-8 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Buscar por nome, coordenador ou instituição..."
              value={search}
              onChange={e=>setSearch(e.target.value)}
            />
          </div>

          <select
            className="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            value={typeFilter}
            onChange={e=>setTypeFilter(e.target.value)}
          >
            <option value="">Todos os tipos</option>
            {[...new Set(projects.map(p=>p.tipo))].map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
      )}

      {projects.length===0 ? (
        <div className="text-center py-24 text-slate-400">
          <div className="text-6xl mb-4">📁</div>
          <div className="text-lg font-medium text-slate-600">Nenhum projeto ainda</div>
          <div className="text-sm mt-1 mb-6">Crie seu primeiro projeto para começar a controlar os financeiros</div>
          <button onClick={onCreate} className="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium text-sm">
            + Criar primeiro projeto
          </button>
        </div>
      ) : filtered.length===0 ? (
        <div className="text-center py-12 text-slate-400">
          <div className="text-3xl mb-2">🔍</div>
          <div>Nenhum projeto encontrado para "<strong>{search}</strong>"</div>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {filtered.map(p=>{
            const itens = allItems[p.id] || [];
            const tipos = allTypes[p.id] || [];
            const aprov = itens.reduce((s,i)=>s+i.valor_total_aprovado,0);
            const pago  = itens.reduce((s,i)=>s+i.valor_total_pago,0);
            const pct   = aprov>0?Math.min(100,(pago/aprov*100)):0;
            const late  = itens.filter(i=>itemStatus(i)==='atrasado').length;
            const tiposCount = tipos.length;

            return (
              <div key={p.id} className="bg-white rounded-2xl border border-slate-100 hover:shadow-md transition-shadow overflow-hidden group">
                <div className="p-5 cursor-pointer" onClick={()=>onOpen(p)}>
                  <div className="flex items-start justify-between gap-2 mb-3">
                    <div className="flex-1">
                      <div className="font-bold text-slate-800 text-base leading-tight group-hover:text-blue-700 transition-colors">{p.nome}</div>
                      <div className="text-xs text-slate-400 mt-1">{p.coordenador}</div>
                      <div className="text-xs text-slate-400">{p.instituicao}</div>
                    </div>
                    <span className="shrink-0 text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full font-medium">{p.tipo}</span>
                  </div>

                  <div className="grid grid-cols-3 gap-2 mb-3 text-center">
                    <div className="bg-slate-50 rounded-lg p-2">
                      <div className="text-xs text-slate-400">Aprovado</div>
                      <div className="text-xs font-bold text-slate-700">{fmtCurrency(aprov)}</div>
                    </div>
                    <div className="bg-emerald-50 rounded-lg p-2">
                      <div className="text-xs text-slate-400">Pago</div>
                      <div className="text-xs font-bold text-emerald-700">{fmtCurrency(pago)}</div>
                    </div>
                    <div className="bg-amber-50 rounded-lg p-2">
                      <div className="text-xs text-slate-400">Saldo</div>
                      <div className={`text-xs font-bold ${aprov-pago<0?'text-red-600':'text-amber-700'}`}>{fmtCurrency(aprov-pago)}</div>
                    </div>
                  </div>

                  <div className="mb-2">
                    <div className="flex justify-between text-xs text-slate-400 mb-1">
                      <span>{itens.length} itens · {tiposCount} tipos</span>
                      <span>{pct.toFixed(0)}% pago</span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-1.5">
                      <div className="bg-blue-500 h-1.5 rounded-full transition-all" style={{width:pct+'%'}} />
                    </div>
                  </div>

                  {late>0 && <div className="text-xs text-red-600 flex items-center gap-1"><span>⚠</span><span>{late} {late===1?'item atrasado':'itens atrasados'}</span></div>}
                  <div className="text-xs text-slate-400 mt-1">Criado em {fmtDate(p.data_criacao)}</div>
                </div>

                <div className="flex items-center gap-1 px-4 py-2.5 bg-slate-50 border-t border-slate-100">
                  <button onClick={()=>onOpen(p)} className="flex-1 text-xs text-blue-600 hover:text-blue-800 font-medium py-1">Abrir →</button>
                  <div className="w-px h-4 bg-slate-200" />
                  <button onClick={()=>onEdit(p)} className="px-2 py-1 text-xs text-slate-500 hover:text-slate-800 rounded-lg hover:bg-white" title="Editar">✏</button>
                  <button onClick={()=>setDelId(p.id)} className="px-2 py-1 text-xs text-red-400 hover:text-red-600 rounded-lg hover:bg-white" title="Excluir">🗑</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {delId && (
        <Confirm
          msg="Deseja excluir este projeto e todos os seus itens? Esta ação não pode ser desfeita."
          onYes={()=>{ onDelete(delId); setDelId(null); toast('Projeto excluído.','error'); }}
          onNo={()=>setDelId(null)}
        />
      )}
    </div>
  );
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────

function Sidebar({ view, onNavigate, projects, currentProjectId, sideOpen, setSideOpen }) {
  return (
    <>
      {sideOpen && <div className="fixed inset-0 bg-black/30 z-20 lg:hidden" onClick={()=>setSideOpen(false)} />}

      <aside className={`fixed lg:static inset-y-0 left-0 z-30 w-64 bg-white border-r border-slate-100 flex flex-col transition-transform duration-200 ${sideOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
        <div className="px-5 py-5 border-b border-slate-100">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">LF</div>
            <div>
              <div className="font-bold text-slate-800 text-sm">LabFinance</div>
              <div className="text-xs text-slate-400">Gestor Financeiro</div>
            </div>
          </div>
        </div>

        <nav className="flex-1 px-3 py-4 overflow-y-auto">
          <button
            onClick={()=>{ onNavigate('dashboard'); setSideOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-medium mb-1 transition ${view==='dashboard'?'bg-blue-600 text-white':'text-slate-600 hover:bg-slate-100'}`}
          >
            <span>🏠</span> Dashboard
          </button>

          {projects.length>0 && (
            <div className="mt-3 mb-1">
              <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide px-3 mb-1">Projetos</div>
              {projects.slice(0,8).map(p=>(
                <button
                  key={p.id}
                  onClick={()=>{ onNavigate('project',p); setSideOpen(false); }}
                  className={`w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs mb-0.5 text-left transition ${view==='project'&&currentProjectId===p.id?'bg-blue-50 text-blue-700 font-semibold':'text-slate-600 hover:bg-slate-50'}`}
                >
                  <span>📁</span><span className="truncate">{p.nome}</span>
                </button>
              ))}
              {projects.length>8 && <div className="text-xs text-slate-400 px-3 py-1">+{projects.length-8} mais...</div>}
            </div>
          )}
        </nav>

        <div className="px-5 py-3 border-t border-slate-100 text-xs text-slate-400 text-center">
          LabFinance v2.0 · {new Date().getFullYear()}
        </div>
      </aside>
    </>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────

function App() {
  const [projects, setProjects, projectsLoaded] = useLS('lf_projects', SAMPLE_PROJECTS);
  const [allItems, setAllItems, itemsLoaded] = useLS('lf_items', SAMPLE_ITEMS);
  const [allTypesRaw, setAllTypes, typesLoaded] = useLS('lf_types', SAMPLE_TYPES);
  const [allRubricas, setAllRubricas, rubricasLoaded] = useLS('lf_rubricas', SAMPLE_RUBRICAS);

  const allTypes = useMemo(() => {
    const result = {};
    Object.keys(allTypesRaw).forEach(pid => {
      result[pid] = migrateTypes(allTypesRaw[pid]);
    });
    return result;
  }, [allTypesRaw]);

  const [view, setView] = useState('dashboard');
  const [currentProject, setCurrentProject] = useState(null);
  const [modalProject, setModalProject] = useState(null);
  const [editingProject, setEditingProject] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);
  const [toasts, pushToast] = useToast();

  const appLoaded = projectsLoaded && itemsLoaded && typesLoaded && rubricasLoaded;

  const navigate = (v, p=null) => {
    setView(v);
    if (p) setCurrentProject(p);
  };

  const saveProject = data => {
    if (editingProject) {
      setProjects(ps=>ps.map(p=>p.id===editingProject.id?{...p,...data}:p));
      if (currentProject?.id===editingProject.id) {
        setCurrentProject(p=>({...p,...data}));
      }
      pushToast('Projeto atualizado!');
    } else {
      const proj = { ...data, id:genId(), criado_em:new Date().toISOString() };
      setProjects(ps=>[proj,...ps]);
      setAllTypes(at=>({ ...at, [proj.id]:[] }));
      setAllRubricas(ar=>({
        ...ar,
        [proj.id]: DEFAULT_RUBRICAS.map(nome => ({ id: genId(), nome }))
      }));
      pushToast('Projeto criado com sucesso!');
    }
    setModalProject(null);
    setEditingProject(null);
  };

  const deleteProject = id => {
    setProjects(ps=>ps.filter(p=>p.id!==id));
    setAllItems(ai=>{ const n={...ai}; delete n[id]; return n; });
    setAllTypes(at=>{ const n={...at}; delete n[id]; return n; });
    setAllRubricas(ar=>{ const n={...ar}; delete n[id]; return n; });
    if (currentProject?.id===id) {
      setView('dashboard');
      setCurrentProject(null);
    }
  };

  const updateItems = (pid,items) => setAllItems(ai=>({ ...ai, [pid]:items }));
  const updateTypes = (pid,types) => setAllTypes(at=>({ ...at, [pid]:types }));
  const updateRubricas = (pid,rubricas) => setAllRubricas(ar=>({ ...ar, [pid]:rubricas }));

  if (!appLoaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center max-w-md w-full">
          <div className="text-4xl mb-3">⏳</div>
          <h1 className="text-lg font-bold text-slate-800 mb-2">Carregando dados do sistema</h1>
          <p className="text-sm text-slate-500">Aguarde enquanto o LabFinance sincroniza seus projetos.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar
        view={view}
        projects={projects}
        currentProjectId={currentProject?.id}
        onNavigate={navigate}
        sideOpen={sideOpen}
        setSideOpen={setSideOpen}
      />

      <div className="flex-1 flex flex-col overflow-hidden">
        <header className="bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 no-print">
          <button onClick={()=>setSideOpen(s=>!s)} className="lg:hidden p-2 rounded-lg hover:bg-slate-100 text-slate-600 text-lg">☰</button>
          <div className="flex-1 text-sm text-slate-500">
            {view==='dashboard'?'Dashboard':currentProject?currentProject.nome:''}
          </div>
          <div className="text-xs text-slate-400 hidden sm:block">{fmtDate(todayISO())}</div>
        </header>

        <main className="flex-1 overflow-y-auto p-5 lg:p-7">
          {view==='dashboard' && (
            <Dashboard
              projects={projects}
              allItems={allItems}
              allTypes={allTypes}
              onOpen={p=>navigate('project',p)}
              onCreate={()=>{ setEditingProject(null); setModalProject('new'); }}
              onEdit={p=>{ setEditingProject(p); setModalProject('edit'); }}
              onDelete={deleteProject}
              toast={pushToast}
            />
          )}

          {view==='project' && currentProject && (
            <ProjectDetail
              project={currentProject}
              items={allItems[currentProject.id] || []}
              projectTypes={allTypes[currentProject.id] || []}
              projectRubricas={allRubricas[currentProject.id] || []}
              onBack={() => navigate('dashboard')}
              onUpdateItems={items => updateItems(currentProject.id, items)}
              onUpdateTypes={types => updateTypes(currentProject.id, types)}
              onUpdateRubricas={rubricas => updateRubricas(currentProject.id, rubricas)}
              onEditProject={p => { setEditingProject(p); setModalProject('edit'); }}
              toast={pushToast}
            />
          )}
        </main>
      </div>

      {modalProject && (
        <Modal title={editingProject?'Editar Projeto':'Novo Projeto'} onClose={()=>{ setModalProject(null); setEditingProject(null); }}>
          <ProjectForm
            project={editingProject}
            onSave={saveProject}
            onCancel={()=>{ setModalProject(null); setEditingProject(null); }}
          />
        </Modal>
      )}

      <ToastContainer toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
