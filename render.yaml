services:
  - type: web
    name: labfinance
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labfinance-db
          property: connectionString

databases:
  - name: labfinance-db
    plan: free
    databaseName: labfinance
    user: labfinance
